<div class="signupContainer">
    <span *ngIf="erroMsg">{{erroMsg}}</span>
    <form>
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" [(ngModel)]="name" class="form-control"  placeholder="Name"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email"  [(ngModel)]="email" class="form-control"  placeholder="xyz@domain.com"/>
        </div>
        <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" name="password"  [(ngModel)]="password" class="form-control"  placeholder="New Password"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="Confirm password"  [(ngModel)]="cfmPassword" class="form-control"  placeholder="Confirm Password"/>
        </div>
        <button class="form-control btn btn-primary" (click)="singup()">Signup</button>
        <div class="d-flex gap-1">
            <span class="">Already have an account</span>
            <span class="text-primary" type="button" (click)="goToLogin()">Login</span>
        </div>
    </form>
</div>
