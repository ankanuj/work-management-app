<div class="w-100 h-100 userProfileContainer d-flex">
    <div class="flex-1 userProfileBody d-flex">
        <div class="userDetails flex-1">
            <ng-container *ngIf="updateUser">
                <input [(ngModel)]="updateUser.name" name="name" class="form-control formField" type="text"/>
                <input [(ngModel)]="updateUser.email" name="email" class="form-control formField" disabled type="email"/>
            </ng-container>
            <!-- <p class="strong m-0">Change Password</p>
            <input [(ngModel)]="newPassword" name="password" class="form-control formField" type="password" placeholder="New Password" />
            <input [(ngModel)]="cfmPassword" name="confirm password" class="form-control formField" type="password" placeholder="Confirm Password"/> -->
        </div>
        <div class="d-flex gap-2 btnContainer flex-end">
            <button class="btn btn-secondary" (click)="cancel()" [disabled]="!isDirty">Cancel</button>
            <button class="btn btn-primary" (click)="update()" [disabled]="!isDirty">Update</button>
        </div>
    </div>
</div>
