<div class="taskBodyCard" cdkDrag [cdkDragData]="task">
    <span>id: {{task.id}}</span>
    <span>created on: {{task.createDate}}</span>
    <p>{{task.title}}</p>
    <span *ngIf="task.completedDate"> Completed Date: {{task.completedDate}}</span>
    <span>{{task.priority}}</span>
    <span>{{task.status}}</span>
</div>
