<div class="taskBoardBody">
    <div class="header d-flex align-center justify-space-between">
        <span class="workSpaceTitle">Work Management App</span>
        <div class="d-flex gap-2">
            <span type="button" *ngIf="currentUser" (click)="goToUserProfile()">{{currentUser.name}}</span>

        </div>
    </div>
    <div class="app-content flex-1">
        <router-outlet></router-outlet>
    </div>
</div>
